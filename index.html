<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metro Electronics · Proforma Invoice</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Archivo', Arial, sans-serif;
        }

        .narrow {
            font-family: 'Archivo Narrow', 'Arial Narrow', Arial, sans-serif;
        }

        .field {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 14px;
            background: #fff;
        }

        .field:focus {
            outline: 2px solid #1e40af;
            outline-offset: 0;
            border-color: #1e40af;
        }

        .lbl {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 3px;
            display: block;
        }

        /* Invoice sheet (A4 @ 96dpi ≈ 794px wide) */
        #invoice {
            width: 794px;
            min-height: 1123px;
            background: #fff;
            color: #111;
            padding: 40px 44px;
            font-size: 13px;
        }

        #invoice table {
            border-collapse: collapse;
            width: 100%;
        }

        #invoice .items th {
            background: #000;
            color: #fff;
            padding: 10px 6px;
            font-size: 12px;
        }

        #invoice .items td {
            border: 1px solid #000;
            padding: 8px 6px;
        }

        #invoice .sum td {
            border: 1px solid #000;
            padding: 3px 8px;
            font-weight: 700;
        }

        .preview-wrap {
            overflow: auto;
        }
    </style>
</head>

<body class="bg-slate-100">

    <header class="bg-blue-900 text-white px-5 py-3 flex items-center justify-between">
        <h1 class="narrow text-xl font-bold">Metro Electronics — Invoice Maker</h1>
        <button id="dl" class="bg-yellow-300 text-black font-semibold px-4 py-2 rounded-md hover:bg-yellow-200">Download
            PDF</button>
    </header>

    <main class="flex flex-col lg:flex-row gap-5 p-4">
        <!-- FORM -->
        <section class="lg:w-[420px] shrink-0 space-y-4">
            <div class="bg-white rounded-lg p-4 space-y-3">
                <h2 class="font-bold">Invoice</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Invoice no.</label><input class="field" id="invNo" value="ME-0001-26"></div>
                    <div><label class="lbl">Date</label><input type="date" class="field" id="invDate"></div>
                    <div><label class="lbl">Currency</label><input class="field" id="cur" value="BDT"></div>
                    <div><label class="lbl">Unit</label><input class="field" id="unit" value="Pcs"></div>
                </div>
            </div>

            <div class="bg-white rounded-lg p-4 space-y-3">
                <h2 class="font-bold">Seller (your company)</h2>
                <div><label class="lbl">Address</label><input class="field" id="sAddr"
                        value="Your street address, Chattogram"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Phone</label><input class="field" id="sPhone" value="+880"></div>
                    <div><label class="lbl">Email</label><input class="field" id="sEmail" value=""></div>
                </div>
                <div><label class="lbl">Logo (optional)</label><input type="file" accept="image/*" id="logoFile"
                        class="text-sm"></div>
            </div>

            <div class="bg-white rounded-lg p-4 space-y-3">
                <h2 class="font-bold">Bill to</h2>
                <div><label class="lbl">Customer name</label><input class="field" id="cName"></div>
                <div><label class="lbl">Company</label><input class="field" id="cCompany"></div>
                <div><label class="lbl">Address</label><textarea class="field" rows="2" id="cAddr"></textarea></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Phone</label><input class="field" id="cPhone"></div>
                    <div><label class="lbl">Email</label><input class="field" id="cEmail"></div>
                    <div><label class="lbl">Weight (optional)</label><input class="field" id="cWeight"
                            placeholder="e.g. 120 KG"></div>
                    <div><label class="lbl">Delivery term</label><input class="field" id="cTerm" value="FOB / BY AIR">
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="sameShip" checked> Ship to
                    same as bill to</label>
                <div id="shipBox" class="hidden space-y-3">
                    <div><label class="lbl">Ship to name</label><input class="field" id="shName"></div>
                    <div><label class="lbl">Ship to address</label><textarea class="field" rows="2"
                            id="shAddr"></textarea></div>
                    <div><label class="lbl">Ship to phone</label><input class="field" id="shPhone"></div>
                </div>
            </div>

            <div class="bg-white rounded-lg p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold">Products</h2>
                    <button id="addItem" class="text-sm bg-blue-900 text-white px-3 py-1.5 rounded-md">Add
                        product</button>
                </div>
                <div id="items" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-lg p-4 space-y-3">
                <h2 class="font-bold">Payment</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Advance received</label><input type="number" class="field" id="advance"
                            value="0"></div>
                    <div><label class="lbl">Payment against LC</label><input type="number" class="field" id="lc"
                            value="0"></div>
                </div>
            </div>

            <div class="bg-white rounded-lg p-4 space-y-2">
                <h2 class="font-bold">Terms &amp; conditions</h2>
                <p class="text-xs text-slate-500">One term per line.</p>
                <textarea class="field" rows="7" id="terms">As per contract 50%-60% payment will be remitted in advance through TT to start production & the remaining amount through banking channel.
Goods will be dispatched within 1 month of advance payment.
After 100% payment the shipment will be released as per the delivery term decided.
Warranty as per manufacturer's terms.
Any term not mentioned above will be decided mutually between Buyer and Seller.</textarea>
            </div>
        </section>

        <!-- PREVIEW -->
        <section class="flex-1 preview-wrap">
            <div id="invoice" class="mx-auto shadow-lg"></div>
        </section>
    </main>

    <footer class="bg-blue-900 text-white text-center text-sm py-4 mt-4">
        © <span id="yr"></span> Metro Electronics · Created by <span class="font-semibold text-yellow-300">MD Mehrab
            Hossain Chowdhury</span>
    </footer>
    <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

    <script>
        const $ = id => document.getElementById(id);
        let items = [{ hs: '8528.72.00', desc: 'LED TV 43"', qty: 10, rate: 32000 }];
        let logoData = '';

        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const num = n => Number(n || 0).toLocaleString('en-US');

        $('invDate').valueAsDate = new Date();

        function renderItemInputs() {
            $('items').innerHTML = items.map((it, i) => `
    <div class="border border-slate-200 rounded-md p-3 space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div class="col-span-2"><label class="lbl">Product name / model</label><input class="field" data-i="${i}" data-k="desc" value="${esc(it.desc)}"></div>
        <div><label class="lbl">HS code</label><input class="field" data-i="${i}" data-k="hs" value="${esc(it.hs)}"></div>
        <div><label class="lbl">Qty</label><input type="number" class="field" data-i="${i}" data-k="qty" value="${it.qty}"></div>
        <div><label class="lbl">Rate per unit</label><input type="number" class="field" data-i="${i}" data-k="rate" value="${it.rate}"></div>
        <div class="flex items-end"><button class="text-sm text-red-700 font-semibold" data-del="${i}">Remove</button></div>
      </div>
    </div>`).join('');
        }

        $('items').addEventListener('input', e => {
            const { i, k } = e.target.dataset;
            if (i === undefined) return;
            items[i][k] = (k === 'qty' || k === 'rate') ? parseFloat(e.target.value) || 0 : e.target.value;
            render();
        });
        $('items').addEventListener('click', e => {
            if (e.target.dataset.del !== undefined) { items.splice(+e.target.dataset.del, 1); renderItemInputs(); render(); }
        });
        $('addItem').onclick = () => { items.push({ hs: '', desc: '', qty: 1, rate: 0 }); renderItemInputs(); render(); };
        $('sameShip').onchange = e => { $('shipBox').classList.toggle('hidden', e.target.checked); render(); };
        $('logoFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader(); r.onload = () => { logoData = r.result; render(); }; r.readAsDataURL(f);
        };
        document.querySelectorAll('section:first-child input, section:first-child textarea').forEach(el => el.addEventListener('input', render));

        function render() {
            const v = id => esc($(id).value);
            const cur = v('cur'), unit = v('unit');
            const total = items.reduce((s, it) => s + it.qty * it.rate, 0);
            const totalQty = items.reduce((s, it) => s + Number(it.qty || 0), 0);
            const adv = parseFloat($('advance').value) || 0;
            const lc = parseFloat($('lc').value) || 0;
            const remaining = total - adv;
            const d = $('invDate').value ? new Date($('invDate').value).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';
            const same = $('sameShip').checked;
            const ship = same
                ? [v('cName'), v('cCompany'), v('cAddr'), v('cPhone')]
                : [v('shName'), '', v('shAddr'), v('shPhone')];
            const terms = $('terms').value.split('\n').filter(t => t.trim());

            const logo = logoData
                ? `<img src="${logoData}" style="max-height:70px;max-width:160px">`
                : `<div style="display:flex;align-items:center;gap:8px">
         <div style="width:58px;height:58px;background:#1e3a8a;color:#fde047;display:flex;align-items:center;justify-content:center;font:800 26px Archivo">ME</div>
         <div class="narrow" style="font-weight:700;font-size:20px;line-height:1">METRO<br>ELECTRONICS</div>
       </div>`;

            const rows = items.map(it => `
    <tr style="height:70px">
      <td style="color:#dc2626;font-weight:700;text-align:center">${esc(it.hs)}</td>
      <td style="font-weight:700;text-align:center">${esc(it.desc)}</td>
      <td style="color:#dc2626;font-weight:700;text-align:center">${num(it.qty)}</td>
      <td style="background:#fef08a;font-weight:700;text-align:center">${num(it.rate)}</td>
      <td style="font-weight:700;text-align:right">${num(it.qty * it.rate)}</td>
    </tr>`).join('');

            $('invoice').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      ${logo}
      <div style="text-align:right">
        <div class="narrow" style="font-size:30px;font-weight:700;color:#1e40af">INVOICE</div>
        <div style="margin-top:6px">${d}</div>
        <div style="font-weight:600">${v('invNo')}</div>
      </div>
    </div>
    <div style="margin-top:14px;line-height:1.5">
      <div style="font-weight:700">Metro Electronics</div>
      <div>${v('sAddr')}</div>
      <div>Phone: ${v('sPhone')}${$('sEmail').value ? ' &nbsp;|&nbsp; Email: ' + v('sEmail') : ''}</div>
    </div>

    <div style="display:flex;gap:30px;margin:18px 0 14px">
      <div style="flex:1.3;line-height:1.55">
        <div style="font-weight:700;border-bottom:1.5px solid #000">Bill To:</div>
        <div><b>Name:</b> <span style="color:#1e3a8a;font-weight:600">${v('cName')}</span></div>
        ${$('cCompany').value ? `<div><b>Company:</b> ${v('cCompany')}</div>` : ''}
        <div><b>Address:</b> ${v('cAddr')}</div>
        <div><b>Phone:</b> ${v('cPhone')}</div>
        ${$('cEmail').value ? `<div><b>Email:</b> ${v('cEmail')}</div>` : ''}
        ${$('cWeight').value ? `<div><b>Weight:</b> <span style="color:#1e3a8a;font-weight:600">${v('cWeight')}</span></div>` : ''}
        <div><b>Estimated Qty:</b> <span style="color:#1e3a8a;font-weight:600">${num(totalQty)} ${unit}</span></div>
        <div><b>Delivery Term:</b> <span style="color:#1e3a8a;font-weight:600">${v('cTerm')}</span></div>
      </div>
      <div style="flex:1;line-height:1.55">
        <div style="font-weight:700;border-bottom:1.5px solid #000">Ship To:</div>
        ${ship.filter(Boolean).map(s => `<div>${s}</div>`).join('')}
      </div>
    </div>

    <table class="items">
      <thead><tr>
        <th style="width:15%">HS CODE</th><th>DESCRIPTION</th><th style="width:12%">QTY (${unit})</th>
        <th style="width:16%">PRICE PER UNIT</th><th style="width:20%">TOTAL PRICE</th>
      </tr></thead>
      <tbody>
        ${rows}
        <tr><td></td><td style="background:#a3d468;font-weight:700">TOTAL QTY: ${num(totalQty)}</td><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <div style="display:flex;gap:16px;margin-top:6px">
      <div style="flex:1;line-height:1.5;padding-left:10px">
        <div style="font-weight:700">Terms &amp; Conditions:</div>
        ${terms.map((t, i) => `<div>${i + 1}- ${esc(t)}</div>`).join('')}
      </div>
      <div style="width:48%">
        <table class="sum">
          <tr><td style="text-align:right;color:#1e40af">TOTAL QTY</td><td></td><td style="text-align:right">${num(totalQty)}</td></tr>
          <tr><td style="text-align:right;color:#dc2626">ADVANCE RECEIVED</td><td style="color:#dc2626">${cur}</td><td style="text-align:right">${adv ? money(adv) : '-'}</td></tr>
          <tr style="background:#fde047"><td style="text-align:right;color:#1e40af;background:#fff">REMAINING</td><td>${cur}</td><td style="text-align:right">${money(remaining)}</td></tr>
          <tr style="background:#d79a92"><td style="text-align:right">SUBTOTAL</td><td>${cur}</td><td style="text-align:right">${money(total)}</td></tr>
        </table>
        ${lc ? `
        <table class="sum" style="margin-top:14px">
          <tr><td style="text-align:right;color:#1e40af">Payment Against LC</td><td style="background:#f6d7b5">${cur}</td><td style="text-align:right;background:#f6d7b5">${money(lc)}</td></tr>
          <tr><td style="text-align:right;color:#dc2626">Payment (Remaining)</td><td style="background:#1e3a8a;color:#fff">${cur}</td><td style="text-align:right;background:#1e3a8a;color:#fff">${money(remaining - lc)}</td></tr>
        </table>` : ''}
      </div>
    </div>

    <div style="display:flex;justify-content:space-around;margin-top:90px;font-weight:700">
      <div><div style="border-top:1px solid #000;width:190px;margin-bottom:8px"></div>SELLER SIGNATURE</div>
      <div><div style="border-top:1px solid #000;width:190px;margin-bottom:8px"></div>BUYER SIGNATURE</div>
    </div>
    <div style="text-align:center;font-weight:700;margin-top:50px">THANK YOU FOR YOUR BUSINESS!</div>
  `;
        }

        $('dl').onclick = () => {
            const name = ($('invNo').value || 'invoice').replace(/[^\w-]+/g, '_');
            html2pdf().set({
                margin: 0,
                filename: `Metro_Electronics_${name}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] },
                pagebreak: { mode: ['css', 'legacy'] }
            }).from($('invoice')).save();
        };

        renderItemInputs();
        render();
    </script>
</body>

</html>
